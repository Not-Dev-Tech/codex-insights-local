name: Bug report
description: Report a reproducible defect using sanitized, synthetic data.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem. Do not attach real Codex sessions,
        reports, prompts, credentials, local paths, or MCP inventories.
        Security vulnerabilities must be reported through the private process
        in SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Version
      description: Output from `codex-insights --version`.
      placeholder: codex-insights 0.2.3
    validations:
      required: true
  - type: input
    id: operating-system
    attributes:
      label: Operating system
      placeholder: Windows 11, macOS 15, Ubuntu 24.04
    validations:
      required: true
  - type: input
    id: python-version
    attributes:
      label: Python version
      description: Output from `python --version`.
      placeholder: Python 3.13.5
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Use a minimal synthetic fixture whenever data is needed.
      placeholder: |
        1. Run ...
        2. Pass ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional sanitized context
      description: Never paste real sessions, prompts, paths, or secrets.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I reviewed this report and removed private or sensitive data.
          required: true
        - label: This is not a security vulnerability.
          required: true
